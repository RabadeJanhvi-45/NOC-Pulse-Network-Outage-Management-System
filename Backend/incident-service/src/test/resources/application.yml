spring:
  application:
    name: incident-service
  datasource:
    url: jdbc:h2:mem:incident-test-db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

eureka:
  client:
    enabled: false

incident:
  sla:
    p1-minutes: 60
    p2-minutes: 240
    p3-minutes: 1440
    p4-minutes: 2880
  sla-scan:
    fixed-delay-ms: 300000

jwt:
  secret: dev-only-change-me-network-outage-dashboard-auth-service-secret-key-2024
  issuer: auth-service

logging:
  level:
    com.noc.incidentservice: WARN
