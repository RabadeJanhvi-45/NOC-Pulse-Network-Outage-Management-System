spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:h2:mem:auth-test-db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

eureka:
  client:
    enabled: false

jwt:
  secret: dev-only-change-me-network-outage-dashboard-auth-service-secret-key-2024
  expiration-ms: 3600000
  issuer: auth-service

logging:
  level:
    com.noc.authservice: WARN
