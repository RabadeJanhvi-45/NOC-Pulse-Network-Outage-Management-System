spring:
  application:
    name: alarm-service
  datasource:
    url: jdbc:h2:mem:alarm-test-db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

eureka:
  client:
    enabled: false

# No device-service running in these tests — skip the Feign existence check.
alarm:
  device-validation:
    enabled: false

jwt:
  secret: dev-only-change-me-network-outage-dashboard-auth-service-secret-key-2024
  issuer: auth-service

logging:
  level:
    com.noc.alarmservice: WARN
